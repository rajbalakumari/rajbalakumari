name: GitHub Snake Game

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate GitHub Contributions Snake
        uses: Platane/snk@v3
        with:
          github_user_name: rajbalakumari
          outputs: |
            dist/github-snake.svg?color_snake=%23D4AF37&color_dots=%23141921,%233D3215,%238B7326,%23D4AF37,%23F7E7A9
            dist/github-snake-dark.svg?color_snake=%23D4AF37&color_dots=%23141921,%233D3215,%238B7326,%23D4AF37,%23F7E7A9

      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update snake animation"
