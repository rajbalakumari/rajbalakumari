```yaml
name: GitHub Snake Game

on:

  # Schedule the workflow to run daily at midnight UTC
  schedule:
    - cron: "0 0 * * *"

  # Allow manual triggering of the workflow
  workflow_dispatch:

  # Trigger the workflow on pushes to the main branch
  push:
    branches:
      - main


# Allow GitHub Actions to write the generated files
permissions:
  contents: write


jobs:

  generate:

    runs-on: ubuntu-latest

    timeout-minutes: 10


    steps:

      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4


      # Step 2: Generate the snake animations
      - name: Generate GitHub Contributions Snake Animations
        uses: Platane/snk@v3

        with:

          # YOUR GitHub username
          github_user_name: rajbalakumari

          # Premium pink / purple color theme
          outputs: |

            dist/github-snake.svg?color_snake=#B62BFF&color_dots=#141921,#4B0082,#B62BFF,#FF005C,#FF7AB8

            dist/github-snake-dark.svg?color_snake=#B62BFF&color_dots=#141921,#4B0082,#B62BFF,#FF005C,#FF7AB8

            dist/ocean.gif?color_snake=#B62BFF&color_dots=#141921,#4B0082,#B62BFF,#FF005C,#FF7AB8&color_background=#141921

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # Step 3: Deploy the generated files to the output branch
      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v4

        with:

          github_token: ${{ secrets.GITHUB_TOKEN }}

          publish_dir: ./dist

          publish_branch: output

          commit_message: "Update snake animation [skip ci]"
```
